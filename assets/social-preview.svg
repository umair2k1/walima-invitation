<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap');

      .bg { fill: #fffdf7; }
      .border-outer { fill: none; stroke: #c2a05a; stroke-width: 2; }
      .border-inner { fill: none; stroke: #c2a05a; stroke-width: 1; stroke-opacity: 0.6; }
      
      .bismillah {
        font-family: 'Amiri', 'Traditional Arabic', serif;
        font-size: 34px;
        fill: #8a6a2e;
        text-anchor: middle;
      }
      .event-tag {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 26px;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        fill: #7a2b3a;
        font-weight: 600;
        text-anchor: middle;
      }
      .names {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 66px;
        font-weight: 700;
        fill: #5c1a26;
        text-anchor: middle;
      }
      .names-amp {
        font-style: italic;
        font-weight: 400;
        fill: #c2a05a;
      }
      .subtext {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 23px;
        font-style: italic;
        fill: #6b5a4e;
        text-anchor: middle;
      }
      .pill-text {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 23px;
        font-weight: 600;
        fill: #33241d;
        text-anchor: middle;
      }
      .venue-name {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 27px;
        font-weight: 700;
        fill: #5c1a26;
        text-anchor: middle;
      }
      .venue-addr {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 21px;
        fill: #6b5a4e;
        text-anchor: middle;
      }
      .family-tag {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 19px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        fill: #8a6a2e;
        font-weight: 600;
        text-anchor: middle;
      }
    </style>

    <pattern id="islamic-subtle" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M30 0 L60 30 L30 60 L0 30 Z" fill="none" stroke="#f0e2ca" stroke-width="0.8" />
      <circle cx="30" cy="30" r="10" fill="none" stroke="#f0e2ca" stroke-width="0.8" />
    </pattern>

    <g id="corner-ornament">
      <path d="M0,0 L42,0 C30,12 12,30 0,42 Z" fill="#5c1a26" />
      <path d="M4,4 L36,4 C26,14 14,26 4,36 Z" fill="none" stroke="#c2a05a" stroke-width="1.5" />
      <circle cx="16" cy="16" r="3" fill="#c2a05a" />
      <path d="M0,52 L52,0" stroke="#c2a05a" stroke-width="1.2" stroke-dasharray="3,3" />
    </g>
  </defs>

  <!-- Background with delicate pattern -->
  <rect width="1200" height="630" class="bg" />
  <rect width="1200" height="630" fill="url(#islamic-subtle)" />

  <!-- Outer borders & frame -->
  <rect x="28" y="28" width="1144" height="574" class="border-outer" rx="4" />
  <rect x="36" y="36" width="1128" height="558" class="border-inner" rx="2" />

  <!-- Corner ornaments -->
  <g transform="translate(36, 36)"><use href="#corner-ornament" /></g>
  <g transform="translate(1164, 36) scale(-1, 1)"><use href="#corner-ornament" /></g>
  <g transform="translate(1164, 594) scale(-1, -1)"><use href="#corner-ornament" /></g>
  <g transform="translate(36, 594) scale(1, -1)"><use href="#corner-ornament" /></g>

  <!-- Top accent header line -->
  <line x1="200" y1="70" x2="1000" y2="70" stroke="#c2a05a" stroke-width="0.75" />
  <polygon points="600,66 605,70 600,74 595,70" fill="#c2a05a" />

  <!-- Bismillah calligraphy -->
  <text x="600" y="112" class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</text>

  <!-- Event title -->
  <text x="600" y="162" class="event-tag">Walima Reception</text>

  <!-- Divider with Gold Diamond -->
  <line x1="380" y1="184" x2="570" y2="184" stroke="#c2a05a" stroke-width="1" />
  <polygon points="600,179 606,184 600,189 594,184" fill="#c2a05a" />
  <circle cx="585" cy="184" r="2" fill="#c2a05a" />
  <circle cx="615" cy="184" r="2" fill="#c2a05a" />
  <line x1="630" y1="184" x2="820" y2="184" stroke="#c2a05a" stroke-width="1" />

  <!-- Couple Names -->
  <text x="600" y="260" class="names">Arshad <tspan class="names-amp">&amp;</tspan> Rizwaana</text>

  <!-- Invitation Subtext -->
  <text x="600" y="306" class="subtext">Warmly invite you to join in celebrating their wedding reception</text>

  <!-- Central Highlight Box for Date & Time -->
  <g transform="translate(240, 335)">
    <rect width="720" height="74" rx="37" fill="#f6eedd" stroke="#c2a05a" stroke-width="1.2" />
    <circle cx="360" cy="37" r="3.5" fill="#c2a05a" />
    
    <!-- Date Section -->
    <text x="180" y="45" class="pill-text">Sunday, 3 January 2027</text>
    
    <!-- Time Section -->
    <text x="540" y="45" class="pill-text">7:00 PM onwards (IST)</text>
  </g>

  <!-- Venue info -->
  <text x="600" y="456" class="venue-name">Natural Greenz Lawn</text>
  <text x="600" y="488" class="venue-addr">Opposite Mahindra Unnati Showroom, Kamptee Road, Nagpur</text>

  <!-- Bottom Divider -->
  <line x1="420" y1="520" x2="570" y2="520" stroke="#c2a05a" stroke-width="1" />
  <polygon points="600,516 605,520 600,524 595,520" fill="#c2a05a" />
  <line x1="630" y1="520" x2="780" y2="520" stroke="#c2a05a" stroke-width="1" />

  <!-- Hosts -->
  <text x="600" y="556" class="family-tag">With Warm Regards — Sheikh Family</text>
</svg>
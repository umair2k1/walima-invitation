<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap');

      .bg { fill: #fffdf7; }
      .border-outer { fill: none; stroke: #c2a05a; stroke-width: 2; }
      .border-inner { fill: none; stroke: #c2a05a; stroke-width: 1; stroke-opacity: 0.6; }
      
      .bismillah {
        font-family: 'Amiri', 'Traditional Arabic', serif;
        font-size: 26px;
        fill: #8a6a2e;
        text-anchor: middle;
      }
      .event-tag {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 20px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        fill: #7a2b3a;
        font-weight: 600;
        text-anchor: middle;
      }
      .names {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 44px;
        font-weight: 700;
        fill: #5c1a26;
        text-anchor: middle;
      }
      .names-amp {
        font-style: italic;
        font-weight: 400;
        fill: #c2a05a;
      }
      .subtext {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 18px;
        font-style: italic;
        fill: #6b5a4e;
        text-anchor: middle;
      }
      .pill-text {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 19px;
        font-weight: 600;
        fill: #33241d;
        text-anchor: middle;
      }
      .venue-name {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 22px;
        font-weight: 700;
        fill: #5c1a26;
        text-anchor: middle;
      }
      .venue-addr {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 17px;
        fill: #6b5a4e;
        text-anchor: middle;
      }
      .family-tag {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 15px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        fill: #8a6a2e;
        font-weight: 600;
        text-anchor: middle;
      }
    </style>

    <pattern id="islamic-subtle-sq" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0 L40 20 L20 40 L0 20 Z" fill="none" stroke="#f0e2ca" stroke-width="0.8" />
      <circle cx="20" cy="20" r="7" fill="none" stroke="#f0e2ca" stroke-width="0.8" />
    </pattern>

    <g id="corner-sq">
      <path d="M0,0 L32,0 C22,10 10,22 0,32 Z" fill="#5c1a26" />
      <path d="M3,3 L26,3 C18,11 11,18 3,26 Z" fill="none" stroke="#c2a05a" stroke-width="1.2" />
      <circle cx="12" cy="12" r="2.5" fill="#c2a05a" />
    </g>
  </defs>

  <rect width="600" height="600" class="bg" />
  <rect width="600" height="600" fill="url(#islamic-subtle-sq)" />

  <rect x="20" y="20" width="560" height="560" class="border-outer" rx="4" />
  <rect x="26" y="26" width="548" height="548" class="border-inner" rx="2" />

  <g transform="translate(26, 26)"><use href="#corner-sq" /></g>
  <g transform="translate(574, 26) scale(-1, 1)"><use href="#corner-sq" /></g>
  <g transform="translate(574, 574) scale(-1, -1)"><use href="#corner-sq" /></g>
  <g transform="translate(26, 574) scale(1, -1)"><use href="#corner-sq" /></g>

  <text x="300" y="85" class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</text>
  <text x="300" y="130" class="event-tag">Walima Reception</text>

  <line x1="160" y1="150" x2="280" y2="150" stroke="#c2a05a" stroke-width="1" />
  <polygon points="300,146 304,150 300,154 296,150" fill="#c2a05a" />
  <line x1="320" y1="150" x2="440" y2="150" stroke="#c2a05a" stroke-width="1" />

  <text x="300" y="215" class="names">Arshad <tspan class="names-amp">&amp;</tspan> Rizwaana</text>
  <text x="300" y="255" class="subtext">Warmly invite you to their wedding reception</text>

  <g transform="translate(60, 280)">
    <rect width="480" height="95" rx="16" fill="#f6eedd" stroke="#c2a05a" stroke-width="1.2" />
    <text x="240" y="38" class="pill-text">Sunday, 3 January 2027</text>
    <line x1="100" y1="52" x2="380" y2="52" stroke="#e3d0a6" stroke-width="1" />
    <text x="240" y="76" class="pill-text">7:00 PM onwards (IST)</text>
  </g>

  <text x="300" y="425" class="venue-name">Natural Greenz Lawn</text>
  <text x="300" y="455" class="venue-addr">Kamptee Road, Nagpur, Maharashtra</text>

  <line x1="200" y1="490" x2="400" y2="490" stroke="#c2a05a" stroke-width="0.8" />
  <text x="300" y="530" class="family-tag">With Warm Regards — Sheikh Family</text>
</svg>